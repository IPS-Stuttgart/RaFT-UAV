name: Apply canonical range-gate fix

on:
  push:
    branches:
      - agent/validate-canonical-tracklet-range-gate

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/validate-canonical-tracklet-range-gate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply focused patch and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/raft_uav/tracklet_viterbi_cli.py')
          source = source_path.read_text(encoding='utf-8')
          old = '''def _env_optional_positive_float(name: str, default: float | None) -> float | None:
              value = os.environ.get(name)
              if value is None or value == "":
                  return default
              parsed = float(value)
              return None if parsed <= 0.0 else parsed
          '''
          new = '''def _env_optional_positive_float(name: str, default: float | None) -> float | None:
              value = os.environ.get(name)
              if value is None or value == "":
                  return default
              parsed = float(value)
              if not math.isfinite(parsed) or parsed < 0.0:
                  raise ValueError(f"{name} must be finite and nonnegative")
              return None if parsed == 0.0 else parsed
          '''
          if source.count(old) != 1:
              raise SystemExit('expected exactly one canonical range-gate helper')
          source_path.write_text(source.replace(old, new), encoding='utf-8')

          test_path = Path('tests/test_tracklet_viterbi_cli_range_gate_env_validation.py')
          test_path.write_text('''from __future__ import annotations

import pytest

from raft_uav import tracklet_viterbi_cli


@pytest.mark.parametrize("value", ["-1", "nan", "inf", "-inf"])
def test_canonical_tracklet_cli_rejects_invalid_range_gate_env(
    monkeypatch: pytest.MonkeyPatch,
    value: str,
) -> None:
    monkeypatch.setenv("RAFT_UAV_TRACKLET_RANGE_GATE_M", value)

    with pytest.raises(
        ValueError,
        match="RAFT_UAV_TRACKLET_RANGE_GATE_M must be finite and nonnegative",
    ):
        tracklet_viterbi_cli._tracklet_config_from_environment()


def test_canonical_tracklet_cli_keeps_zero_as_disabled_range_gate(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    monkeypatch.setenv("RAFT_UAV_TRACKLET_RANGE_GATE_M", "0")

    config = tracklet_viterbi_cli._tracklet_config_from_environment()

    assert config.range_gate_m is None


def test_canonical_tracklet_cli_preserves_positive_range_gate_env(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    monkeypatch.setenv("RAFT_UAV_TRACKLET_RANGE_GATE_M", "725.5")

    config = tracklet_viterbi_cli._tracklet_config_from_environment()

    assert config.range_gate_m == pytest.approx(725.5)
''', encoding='utf-8')

          Path('.github/workflows/agent-validate-range-gate.yml').unlink()
          PY
          python -m py_compile src/raft_uav/tracklet_viterbi_cli.py tests/test_tracklet_viterbi_cli_range_gate_env_validation.py
      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/raft_uav/tracklet_viterbi_cli.py tests/test_tracklet_viterbi_cli_range_gate_env_validation.py .github/workflows/agent-validate-range-gate.yml
          git commit -m "Validate canonical tracklet range-gate overrides"
          git push origin HEAD:agent/validate-canonical-tracklet-range-gate
