---
name: Materialize and normalize LTS temporal formation source

"on":
  push:
    branches:
      - agent/lts-temporal-formation-metric-stack
    paths:
      - ".github/workflows/materialize-lts-temporal-followup.yml"
      - ".github/patches/materialize_lts_temporal_followup.py.gz"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: materialize-lts-temporal-followup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/lts-temporal-formation-metric-stack
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Materialize reviewed source payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=.github/patches/materialize_lts_temporal_followup.py.gz
          test -f "$payload"
          gzip -t "$payload"
          echo "payload_sha256=$(sha256sum "$payload" | awk '{print $1}')"
          gzip -cd "$payload" > /tmp/materialize_lts_temporal_followup.py

          set +e
          python /tmp/materialize_lts_temporal_followup.py \
            > /tmp/materializer.stdout \
            2> /tmp/materializer.stderr
          rc=$?
          set -e

          if (( rc != 0 )); then
            python - "$rc" <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.request

          rc = int(sys.argv[1])
          stdout = pathlib.Path("/tmp/materializer.stdout").read_text(
              encoding="utf-8", errors="replace"
          )
          stderr = pathlib.Path("/tmp/materializer.stderr").read_text(
              encoding="utf-8", errors="replace"
          )
          payload = pathlib.Path(
              ".github/patches/materialize_lts_temporal_followup.py.gz"
          )
          import hashlib
          payload_sha = hashlib.sha256(payload.read_bytes()).hexdigest()
          details = (
              f"return_code={rc}\n"
              f"run_id={os.environ.get('GITHUB_RUN_ID', '')}\n"
              f"commit={os.environ.get('GITHUB_SHA', '')}\n"
              f"payload_sha256={payload_sha}\n\n"
              f"=== stdout ===\n{stdout}\n"
              f"=== stderr ===\n{stderr}\n"
          )
          details = details[-55000:]
          body = (
              "<!-- lts-materializer-diagnostic -->\n"
              "### Temporal source materializer failed\n\n"
              "The compressed payload was valid gzip, but its Python generator "
              "returned a nonzero status. Exact diagnostic:\n\n"
              f"```text\n{details}\n```"
          )
          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/issues/2550/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "raft-uav-materializer-diagnostic",
              },
          )
          with urllib.request.urlopen(request) as response:
              print(f"posted diagnostic comment: HTTP {response.status}")

          annotation = " | ".join(
              line.strip() for line in stderr.splitlines()[-20:] if line.strip()
          )
          annotation = annotation.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Temporal materializer failed::{annotation}")
          PY
            exit "$rc"
          fi

          cat /tmp/materializer.stdout
          test ! -s /tmp/materializer.stderr || cat /tmp/materializer.stderr >&2

      - name: Restore ordinary CI and evidence workflows
        shell: bash
        run: |
          set -euo pipefail
          source_commit=792b013534f8461d7578b95d7b42ef9b2fae05ff
          git show "$source_commit:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git show "$source_commit:.github/workflows/multi-uav-lts-temporal-formation-evidence.yml" > .github/workflows/multi-uav-lts-temporal-formation-evidence.yml
          rm -rf .github/diagnostics
          rm -f .github/patches/materialize_lts_temporal_followup.py.gz
          rm -f .github/workflows/materialize-lts-temporal-followup.yml
          git diff --check
          git status --short

      - name: Publish materialized ordinary source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "Materializer produced no source changes" >&2
            exit 1
          }
          git commit -m "fix(lts): materialize source and restore CI"
          git push origin HEAD:agent/lts-temporal-formation-metric-stack

      - name: Validate importable generated source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m py_compile scripts/run_multi_uav_lts_temporal_formation_evidence.py
          python -m pytest -q \
            tests/test_multi_uav_lts_scene_stabilization.py \
            tests/test_multi_uav_lts_registered_temporal_proposals.py \
            tests/test_multi_uav_lts_temporal_consensus.py \
            tests/test_multi_uav_lts_temporal_formation_settings.py \
            tests/test_multi_uav_lts_evidence_integrity.py \
            tests/test_multi_uav_lts_learned_motion_prior.py \
            tests/test_multi_uav_lts_seeded_multiscan.py \
            tests/test_multi_uav_lts_seeded_multiscan_geometry.py \
            tests/test_multi_uav_lts_formation_reassociation.py \
            tests/test_multi_uav_lts_metric_aware_boxes.py \
            tests/test_multi_uav_lts_adaptive_kinematic.py
