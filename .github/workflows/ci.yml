---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile importable code and tests
        run: |
          python -m compileall src tests
          if [ -d scripts ]; then python -m compileall scripts; fi

      - name: Lint source and tests
        run: |
          if [ -d scripts ]; then
            ruff check --select E4,E7,E9,F src scripts tests
          else
            ruff check --select E4,E7,E9,F src tests
          fi

      - name: Run unit tests with diagnostic capture
        id: pytest
        shell: bash
        run: |
          set +e
          pytest 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish pytest failure on the pull request
        if: steps.pytest.outputs.status != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('pytest-output.txt', 'utf8');
            const tail = raw.slice(-60000).replaceAll('```', '` ` `');
            const body = [
              `### Pytest failure on Python ${process.env.PYTHON_VERSION}`,
              '',
              '```text',
              tail,
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Propagate pytest failure
        if: steps.pytest.outputs.status != '0'
        run: exit "${{ steps.pytest.outputs.status }}"
