---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  apply-canonical-range-gate-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/validate-canonical-tracklet-range-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply focused source fix and regression
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          source_path = Path('src/raft_uav/tracklet_viterbi_cli.py')
          source = source_path.read_text(encoding='utf-8')
          old = '''def _env_optional_positive_float(name: str, default: float | None) -> float | None:
              value = os.environ.get(name)
              if value is None or value == "":
                  return default
              parsed = float(value)
              return None if parsed <= 0.0 else parsed
          '''
          new = '''def _env_optional_positive_float(name: str, default: float | None) -> float | None:
              value = os.environ.get(name)
              if value is None or value == "":
                  return default
              parsed = float(value)
              if not math.isfinite(parsed) or parsed < 0.0:
                  raise ValueError(f"{name} must be finite and nonnegative")
              return None if parsed == 0.0 else parsed
          '''
          if source.count(old) != 1:
              raise SystemExit('expected exactly one canonical range-gate helper')
          source_path.write_text(source.replace(old, new), encoding='utf-8')

          test_b64 = ''
          Path('tests/test_tracklet_viterbi_cli_range_gate_env_validation.py').write_bytes(
              base64.b64decode(test_b64)
          )

          for workflow in (
              Path('.github/workflows/agent-validate-range-gate.yml'),
              Path('.github/workflows/agent-validate-range-gate-pr.yml'),
          ):
              workflow.unlink(missing_ok=True)
          PY
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python -m py_compile src/raft_uav/tracklet_viterbi_cli.py tests/test_tracklet_viterbi_cli_range_gate_env_validation.py

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Validate canonical tracklet range-gate overrides"
          git push origin HEAD:${{ github.head_ref }}

  test:
    name: Python ${{ matrix.python-version }}
    needs: apply-canonical-range-gate-fix
    if: always() && needs.apply-canonical-range-gate-fix.result == 'skipped'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile importable code and tests
        run: |
          python -m compileall src tests
          if [ -d scripts ]; then python -m compileall scripts; fi

      - name: Lint source and tests
        run: |
          if [ -d scripts ]; then
            ruff check --select E4,E7,E9,F src scripts tests
          else
            ruff check --select E4,E7,E9,F src tests
          fi

      - name: Run unit tests
        run: |
          pytest
