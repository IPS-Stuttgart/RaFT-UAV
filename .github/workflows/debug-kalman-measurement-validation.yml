name: Debug Kalman measurement validation

on:
  push:
    branches:
      - agent/reject-lossy-kalman-measurements

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --quiet -e ".[dev]"
      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_kalman_baseline.py
          tests/test_kalman_measurement_array_validation.py
