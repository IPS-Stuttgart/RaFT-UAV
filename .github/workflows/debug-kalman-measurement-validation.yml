name: Debug Kalman measurement validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone, install, and run focused tests
        run: |
          git clone --quiet --depth 1 --branch agent/reject-lossy-kalman-measurements \
            https://github.com/IPS-Stuttgart/RaFT-UAV.git repo
          cd repo
          python -m pip install --quiet -e ".[dev]"
          python -m pytest -vv --tb=short \
            tests/test_kalman_baseline.py \
            tests/test_kalman_measurement_array_validation.py
