---
name: Materialize temporal formation follow-up

"on":
  push:
    branches:
      - agent/lts-temporal-formation-metric-stack
    paths:
      - ".github/workflows/multi-uav-lts-temporal-formation-evidence.yml"
      - ".github/patches/materialize_lts_temporal_followup.py.gz"

permissions:
  contents: write

concurrency:
  group: materialize-lts-temporal-followup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply the reviewed follow-up patch
        shell: bash
        run: |
          set -euo pipefail
          echo "8618903e05029a97e08fd02341f91d56ae42fe47d82027bd2664b1d1285f4c97  .github/patches/materialize_lts_temporal_followup.py.gz" | sha256sum -c -
          gzip -cd .github/patches/materialize_lts_temporal_followup.py.gz > .github/patches/materialize_lts_temporal_followup.py
          python .github/patches/materialize_lts_temporal_followup.py
          rm -f .github/patches/materialize_lts_temporal_followup.py.gz
      - name: Publish the source before validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden and extend temporal formation evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Validate the published source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pytest -q \
            tests/test_multi_uav_lts_scene_stabilization.py \
            tests/test_multi_uav_lts_registered_temporal_proposals.py \
            tests/test_multi_uav_lts_temporal_p2_detector.py \
            tests/test_multi_uav_lts_temporal_consensus.py \
            tests/test_multi_uav_lts_temporal_formation_settings.py \
            tests/test_multi_uav_lts_evidence_integrity.py \
            tests/test_multi_uav_lts_learned_motion_prior.py \
            tests/test_multi_uav_lts_seeded_multiscan.py \
            tests/test_multi_uav_lts_seeded_multiscan_geometry.py \
            tests/test_multi_uav_lts_formation_reassociation.py \
            tests/test_multi_uav_lts_metric_aware_boxes.py \
            tests/test_multi_uav_lts_adaptive_kinematic.py
          python -m py_compile scripts/run_multi_uav_lts_temporal_formation_evidence.py
          python -m ruff check \
            scripts/run_multi_uav_lts_temporal_formation_evidence.py \
            src/raft_uav/multi_uav_lts/adaptive_kinematic.py \
            src/raft_uav/multi_uav_lts/evidence_integrity.py \
            src/raft_uav/multi_uav_lts/formation_reassociation.py \
            src/raft_uav/multi_uav_lts/learned_motion_prior.py \
            src/raft_uav/multi_uav_lts/metric_aware_boxes.py \
            src/raft_uav/multi_uav_lts/registered_temporal_proposals.py \
            src/raft_uav/multi_uav_lts/scene_stabilization.py \
            src/raft_uav/multi_uav_lts/seeded_multiscan.py \
            src/raft_uav/multi_uav_lts/temporal_consensus.py \
            src/raft_uav/multi_uav_lts/temporal_formation_settings.py \
            src/raft_uav/multi_uav_lts/temporal_p2_detector.py \
            tests/test_multi_uav_lts_scene_stabilization.py \
            tests/test_multi_uav_lts_registered_temporal_proposals.py \
            tests/test_multi_uav_lts_temporal_p2_detector.py \
            tests/test_multi_uav_lts_temporal_consensus.py \
            tests/test_multi_uav_lts_temporal_formation_settings.py \
            tests/test_multi_uav_lts_evidence_integrity.py \
            tests/test_multi_uav_lts_learned_motion_prior.py \
            tests/test_multi_uav_lts_seeded_multiscan_geometry.py \
            tests/test_multi_uav_lts_formation_reassociation.py \
            tests/test_multi_uav_lts_metric_aware_boxes.py \
            tests/test_multi_uav_lts_adaptive_kinematic.py
          git diff --check
