---
name: Apply cross-fitted edge evidence

"on":
  pull_request:
    branches: [main]
    paths:
      - ".github/cross-fitted-edge-evidence.tar.gz"
      - ".github/workflows/apply-cross-fitted-edge-evidence.yml"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RAFT_UAV_SKIP_RUNTIME_HOOKS: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out payload commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Materialize and validate final files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .github/cross-fitted-edge-evidence.tar.gz
          rm -f \
            .github/cross-fitted-edge-evidence.tar.gz \
            .github/workflows/apply-cross-fitted-edge-evidence.yml
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q \
            tests/test_multi_uav_lts_cross_fitted_edge_evidence.py \
            tests/test_multi_uav_lts_proposal_edge_likelihood.py \
            tests/test_multi_uav_lts_similarity_motion.py \
            tests/test_multi_uav_lts_delayed_path_cover.py
          python -m py_compile \
            scripts/run_multi_uav_lts_cross_fitted_edge_evidence.py \
            tests/test_multi_uav_lts_cross_fitted_edge_evidence.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path(".github/workflows/multi-uav-lts-proposal-graph-evidence.yml")
          payload = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert payload["name"] == "Multi-UAV LTS proposal graph evidence"
          PY
          python -m ruff check \
            scripts/run_multi_uav_lts_cross_fitted_edge_evidence.py \
            tests/test_multi_uav_lts_cross_fitted_edge_evidence.py

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add cross-fitted learned-edge evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
