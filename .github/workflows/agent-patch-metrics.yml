name: Agent patch metrics

on:
  push:
    branches:
      - agent/reject-complex-metric-time-gates

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reject-complex-metric-time-gates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch metric time-gate validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          metrics_path = Path("src/raft_uav/evaluation/metrics.py")
          text = metrics_path.read_text()
          old = '''    array = np.asarray(value)
              if array.ndim != 0:
                  raise ValueError("max_time_delta_s must be a finite, non-negative scalar")
              scalar = array.item()
              if isinstance(scalar, (bool, np.bool_)):
                  raise ValueError("max_time_delta_s must be a finite, non-negative scalar")
          '''
          new = '''    array = np.asarray(value)
              if array.ndim != 0 or np.iscomplexobj(array):
                  raise ValueError("max_time_delta_s must be a finite, non-negative scalar")
              scalar = array.item()
              if (
                  isinstance(scalar, (bool, np.bool_))
                  or np.ma.is_masked(scalar)
                  or np.iscomplexobj(scalar)
              ):
                  raise ValueError("max_time_delta_s must be a finite, non-negative scalar")
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if text.count(old) != 1:
              raise SystemExit("expected metric validation block exactly once")
          metrics_path.write_text(text.replace(old, new, 1))

          test_path = Path("tests/test_metrics_complex_time_gate.py")
          test_path.write_text('''from __future__ import annotations

          from collections.abc import Callable

          import numpy as np
          import pytest

          from raft_uav.evaluation.metrics import position_errors_m


          def _object_scalar(value: object) -> object:
              return np.asarray(value, dtype=object)


          def _unmasked_object_scalar(value: object) -> object:
              return np.ma.array(np.asarray(value, dtype=object), mask=False)


          @pytest.mark.parametrize("complex_type", [np.complex64, np.complex128])
          @pytest.mark.parametrize(
              "wrap",
              [_object_scalar, _unmasked_object_scalar],
              ids=["object-array", "unmasked-object-array"],
          )
          def test_position_errors_rejects_object_wrapped_complex_time_gate(
              complex_type: type[np.complexfloating],
              wrap: Callable[[object], object],
          ) -> None:
              times = np.array([0.0, 1.0])
              positions = np.column_stack(
                  [times, np.zeros_like(times), np.zeros_like(times)]
              )
              max_time_delta_s = wrap(complex_type(complex(0.25, 1.0)))

              with pytest.raises(
                  ValueError,
                  match="max_time_delta_s must be a finite, non-negative scalar",
              ):
                  position_errors_m(
                      times,
                      positions,
                      times,
                      positions,
                      max_time_delta_s=max_time_delta_s,
                  )


          def test_position_errors_accepts_object_wrapped_real_time_gate() -> None:
              times = np.array([0.0, 1.0])
              positions = np.column_stack(
                  [times, np.zeros_like(times), np.zeros_like(times)]
              )

              errors = position_errors_m(
                  times,
                  positions,
                  times,
                  positions,
                  max_time_delta_s=np.asarray(np.float64(0.25), dtype=object),
              )

              np.testing.assert_allclose(errors, np.zeros(2))
          '''.replace("          ", ""))
          PY

      - name: Validate focused regression
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m py_compile \
            src/raft_uav/evaluation/metrics.py \
            tests/test_metrics_complex_time_gate.py
          pytest -q tests/test_metrics_complex_time_gate.py

      - name: Commit patched files
        shell: bash
        run: |
          rm .github/workflows/agent-patch-metrics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/raft_uav/evaluation/metrics.py \
            tests/test_metrics_complex_time_gate.py \
            .github/workflows/agent-patch-metrics.yml
          git commit -m "Reject complex metric time gates"
          git push origin HEAD:agent/reject-complex-metric-time-gates
