---
name: Multi-UAV LTS metric-aware evidence

"on":
  pull_request:
    branches:
      - main
      - agent/lts-proposal-graph-evidence
    paths:
      - ".github/workflows/multi-uav-lts-metric-aware-evidence.yml"
      - "config/multi_uav_lts_box_policy.example.json"
      - "docs/multi_uav_lts_metric_aware.md"
      - "scripts/run_multi_uav_lts_metric_aware_evidence.py"
      - "scripts/run_multi_uav_lts_metric_scenario_evidence.py"
      - "src/raft_uav/multi_uav_lts/_proposal_metric_edge_likelihood.py"
      - "src/raft_uav/multi_uav_lts/metric_proposal_graph_tracker.py"
      - "src/raft_uav/multi_uav_lts/proposal_bank_fusion.py"
      - "src/raft_uav/multi_uav_lts/proposal_metric_edge_model.py"
      - "src/raft_uav/multi_uav_lts/scenario_box_policy.py"
      - "src/raft_uav/multi_uav_lts/temporal_residual_proposals.py"
      - "src/raft_uav/multi_uav_lts/trajectory_box_calibration.py"
      - "src/raft_uav/multi_uav_lts/trajectory_gap_completion.py"
      - "tests/test_multi_uav_lts_metric_edge_likelihood.py"
      - "tests/test_multi_uav_lts_proposal_bank_fusion.py"
      - "tests/test_multi_uav_lts_scenario_box_policy.py"
      - "tests/test_multi_uav_lts_temporal_residual_proposals.py"
      - "tests/test_multi_uav_lts_trajectory_box_calibration.py"
      - "tests/test_multi_uav_lts_trajectory_gap_completion.py"
  workflow_dispatch:
    inputs:
      device:
        description: CUDA device used for proposal generation
        required: true
        default: "0"
        type: string
      expected_sequence_count:
        description: Required number of official training sequences
        required: true
        default: "102"
        type: string
      expected_frame_count:
        description: Required number of official training frames
        required: true
        default: "77293"
        type: string
      require_improvement:
        description: Fail unless a metric-aware candidate clears every gate
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: multi-uav-lts-metric-aware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RAFT_UAV_SKIP_RUNTIME_HOOKS: "1"

jobs:
  focused-tests:
    name: Metric-aware focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out RaFT-UAV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q \
            tests/test_multi_uav_lts_metric_edge_likelihood.py \
            tests/test_multi_uav_lts_proposal_bank_fusion.py \
            tests/test_multi_uav_lts_scenario_box_policy.py \
            tests/test_multi_uav_lts_temporal_residual_proposals.py \
            tests/test_multi_uav_lts_trajectory_box_calibration.py \
            tests/test_multi_uav_lts_trajectory_gap_completion.py \
            tests/test_multi_uav_lts_cross_fitted_edge_evidence.py \
            tests/test_multi_uav_lts_delayed_path_cover.py \
            tests/test_multi_uav_lts_proposal_edge_likelihood.py
          python -m py_compile \
            scripts/run_multi_uav_lts_metric_aware_evidence.py \
            scripts/run_multi_uav_lts_metric_scenario_evidence.py \
            src/raft_uav/multi_uav_lts/_proposal_metric_edge_likelihood.py \
            src/raft_uav/multi_uav_lts/metric_proposal_graph_tracker.py \
            src/raft_uav/multi_uav_lts/proposal_bank_fusion.py \
            src/raft_uav/multi_uav_lts/proposal_metric_edge_model.py \
            src/raft_uav/multi_uav_lts/scenario_box_policy.py \
            src/raft_uav/multi_uav_lts/temporal_residual_proposals.py \
            src/raft_uav/multi_uav_lts/trajectory_box_calibration.py \
            src/raft_uav/multi_uav_lts/trajectory_gap_completion.py
          python scripts/run_multi_uav_lts_metric_scenario_evidence.py --help >/dev/null
          python -m ruff check \
            scripts/run_multi_uav_lts_metric_aware_evidence.py \
            scripts/run_multi_uav_lts_metric_scenario_evidence.py \
            src/raft_uav/multi_uav_lts/_proposal_metric_edge_likelihood.py \
            src/raft_uav/multi_uav_lts/metric_proposal_graph_tracker.py \
            src/raft_uav/multi_uav_lts/proposal_bank_fusion.py \
            src/raft_uav/multi_uav_lts/proposal_metric_edge_model.py \
            src/raft_uav/multi_uav_lts/scenario_box_policy.py \
            src/raft_uav/multi_uav_lts/temporal_residual_proposals.py \
            src/raft_uav/multi_uav_lts/trajectory_box_calibration.py \
            src/raft_uav/multi_uav_lts/trajectory_gap_completion.py \
            tests/test_multi_uav_lts_metric_edge_likelihood.py \
            tests/test_multi_uav_lts_proposal_bank_fusion.py \
            tests/test_multi_uav_lts_scenario_box_policy.py \
            tests/test_multi_uav_lts_temporal_residual_proposals.py \
            tests/test_multi_uav_lts_trajectory_box_calibration.py \
            tests/test_multi_uav_lts_trajectory_gap_completion.py

  train-evidence:
    name: Guarded 102-sequence metric-aware tournament
    needs: focused-tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 720

    env:
      GPU_DEVICE: ${{ inputs.device || '0' }}
      EXPECTED_SEQUENCE_COUNT: ${{ inputs.expected_sequence_count || '102' }}
      EXPECTED_FRAME_COUNT: ${{ inputs.expected_frame_count || '77293' }}
      REQUIRE_IMPROVEMENT: >-
        ${{ github.event_name == 'pull_request' || inputs.require_improvement }}

    steps:
      - name: Check out RaFT-UAV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Select persistent evidence cache
        shell: bash
        run: |
          set -euo pipefail
          minimum_free_bytes=$((16 * 1024 * 1024 * 1024))
          best_root=""
          best_free=0
          candidates=(
            "/mnt/corsair/raft-uav-public-evidence"
            "${HOME}/.cache/raft-uav-public-evidence"
            "${RUNNER_TEMP}/raft-uav-public-evidence"
          )
          for candidate in "${candidates[@]}"; do
            free_bytes=0
            if mkdir -p "${candidate}" 2>/dev/null; then
              probe="${candidate}/.write-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              if printf 'ok\n' > "${probe}" 2>/dev/null; then
                rm -f "${probe}"
                free_bytes="$(df -PB1 "${candidate}" | awk 'NR == 2 {print $4}')"
              fi
            fi
            if (( free_bytes > best_free )); then
              best_root="${candidate}"
              best_free="${free_bytes}"
            fi
          done
          if [[ -z "${best_root}" ]] || (( best_free < minimum_free_bytes )); then
            echo "No evidence cache has the required free space." >&2
            exit 1
          fi

          work_root="${best_root}/multi-uav-lts-zenodo-15853476"
          run_dir="${work_root}/metric-aware-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          venv_path="${work_root}/runtime/venvs/proposal-graph-py311-torch222"
          asset_dir="${work_root}/assets/runtime"
          inputs_json="${run_dir}/public-inputs.json"
          mkdir -p "${run_dir}" "${asset_dir}" "$(dirname "${venv_path}")"
          {
            printf 'WORK_ROOT=%s\n' "${work_root}"
            printf 'RUN_DIR=%s\n' "${run_dir}"
            printf 'VENV_PATH=%s\n' "${venv_path}"
            printf 'ASSET_DIR=%s\n' "${asset_dir}"
            printf 'INPUTS_JSON=%s\n' "${inputs_json}"
          } >> "${GITHUB_ENV}"
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "git_commit=${GITHUB_SHA}"
            echo "cache_root=${best_root}"
            echo "cache_free_bytes=${best_free}"
            nvidia-smi -L
            df -hT
          } | tee "${run_dir}/runner.txt"

      - name: Acquire and verify official public inputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/bootstrap_multi_uav_lts_public_evidence.py \
            --work-root "${WORK_ROOT}" \
            --output-json "${INPUTS_JSON}" \
            --expected-sequence-count "${EXPECTED_SEQUENCE_COUNT}" \
            --expected-frame-count "${EXPECTED_FRAME_COUNT}" \
            | tee "${RUN_DIR}/public-inputs-console.txt"

      - name: Install and verify pinned GPU runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_multi_uav_lts_public_runtime.sh \
            "${VENV_PATH}" \
            "${ASSET_DIR}" \
            "${RUN_DIR}/runtime-provenance.json" \
            | tee "${RUN_DIR}/runtime-install-console.txt"
          bash scripts/install_multi_uav_lts_runtime_extras.sh \
            "${VENV_PATH}" \
            "${RUN_DIR}/runtime-provenance.json" \
            | tee -a "${RUN_DIR}/runtime-install-console.txt"

      - name: Generate and score metric-aware candidates
        shell: bash
        run: |
          set -euo pipefail
          improvement_args=()
          if [[ "${REQUIRE_IMPROVEMENT}" == "true" ]]; then
            improvement_args+=(--require-improvement)
          fi
          "${VENV_PATH}/bin/python" \
            scripts/run_multi_uav_lts_metric_scenario_evidence.py \
            --inputs-json "${INPUTS_JSON}" \
            --run-dir "${RUN_DIR}" \
            --device "${GPU_DEVICE}" \
            --expected-sequence-count "${EXPECTED_SEQUENCE_COUNT}" \
            --expected-frame-count "${EXPECTED_FRAME_COUNT}" \
            "${improvement_args[@]}" \
            | tee "${RUN_DIR}/evidence-console.txt"

      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          print("### Multi-UAV LTS metric-aware evidence")
          run_dir_text = os.environ.get("RUN_DIR")
          if not run_dir_text:
              print("\nRun directory was not established.")
              raise SystemExit(0)
          run_dir = Path(run_dir_text)
          success = run_dir / "evidence-summary.json"
          failure = run_dir / "evidence-failure.json"
          if success.is_file():
              payload = json.loads(success.read_text(encoding="utf-8"))
              print("\n- Result: **success**")
          elif failure.is_file():
              payload = json.loads(failure.read_text(encoding="utf-8"))
              print("\n- Result: **failure**")
              print(f"- Failed stage: `{payload.get('stage', 'unknown')}`")
              print(f"- Failure: `{payload.get('exception_message', 'unknown')}`")
          else:
              print("\nNo machine-readable evidence result was produced.")
              raise SystemExit(0)
          tournament = payload.get("tournament")
          if not isinstance(tournament, dict):
              raise SystemExit(0)
          print(f"- Selected: `{tournament.get('selected_candidate', 'unknown')}`")
          print(f"- Status: `{tournament.get('selection_status', 'unknown')}`")
          rows = tournament.get("rows")
          if not isinstance(rows, list):
              raise SystemExit(0)
          print("\n| Candidate | Eligible | CV HOTA | Gain | CI low | MOTA delta | IDF1 delta |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          for row in rows:
              print(
                  f"| {row.get('name')} | {row.get('eligible')} | "
                  f"{float(row.get('mean_cv_codabench_hota', 0.0)):.6f} | "
                  f"{float(row.get('mean_cv_hota_gain_vs_raw', 0.0)):+.6f} | "
                  f"{float(row.get('paired_hota_gain_ci_low', 0.0)):+.6f} | "
                  f"{float(row.get('mean_cv_mota_delta_vs_raw', 0.0)):+.6f} | "
                  f"{float(row.get('mean_cv_idf1_delta_vs_raw', 0.0)):+.6f} |"
              )
          PY

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: multi-uav-lts-metric-aware-${{ github.run_id }}
          path: |
            ${{ env.RUN_DIR }}/runner.txt
            ${{ env.RUN_DIR }}/public-inputs.json
            ${{ env.RUN_DIR }}/public-inputs-console.txt
            ${{ env.RUN_DIR }}/runtime-provenance.json
            ${{ env.RUN_DIR }}/runtime-install-console.txt
            ${{ env.RUN_DIR }}/probe.json
            ${{ env.RUN_DIR }}/progress.json
            ${{ env.RUN_DIR }}/proposal-source-manifest.json
            ${{ env.RUN_DIR }}/proposal-baseline-console.txt
            ${{ env.RUN_DIR }}/cross-fitted-edge-folds.json
            ${{ env.RUN_DIR }}/cross-fitted-edge-models/**/*.json
            ${{ env.RUN_DIR }}/cross-fitted-metric-edge-models/**/*.json
            ${{ env.RUN_DIR }}/cross-fitted-metric-edge-models/**/*console.txt
            ${{ env.RUN_DIR }}/evidence-console.txt
            ${{ env.RUN_DIR }}/evidence-summary.json
            ${{ env.RUN_DIR }}/evidence-failure.json
            ${{ env.RUN_DIR }}/raw/*.json
            ${{ env.RUN_DIR }}/raw/*.csv
            ${{ env.RUN_DIR }}/raw/*console.txt
            ${{ env.RUN_DIR }}/graph_*/*.json
            ${{ env.RUN_DIR }}/graph_*/*.csv
            ${{ env.RUN_DIR }}/graph_*/*console.txt
            ${{ env.RUN_DIR }}/graph_*/fold-groups/**/*.json
            ${{ env.RUN_DIR }}/graph_*/fold-groups/**/*console.txt
            ${{ env.RUN_DIR }}/graph_*/resolution-groups/**/*.json
            ${{ env.RUN_DIR }}/graph_*/resolution-groups/**/*console.txt
            ${{ env.RUN_DIR }}/scenario-policy-reference-*/*.json
            ${{ env.RUN_DIR }}/scenario-policy-reference-*/*console.txt
            ${{ env.RUN_DIR }}/scenario-policy-reference-*/resolution-groups/**/*.json
            ${{ env.RUN_DIR }}/scenario-policy-reference-*/resolution-groups/**/*console.txt
            ${{ env.RUN_DIR }}/tournament/*.json
            ${{ env.RUN_DIR }}/tournament/*.csv
            ${{ env.RUN_DIR }}/tournament/*.txt
            ${{ env.RUN_DIR }}/tournament-console.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
