---
name: Multi-UAV LTS proposal graph experiment

"on":
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/multi-uav-lts-proposal-graph.yml"
      - "docs/multi_uav_lts_proposal_graph.md"
      - "src/raft_uav/multi_uav_lts/_proposal_graph_core.py"
      - "src/raft_uav/multi_uav_lts/proposal_graph_tracker.py"
      - "tests/test_multi_uav_lts_proposal_graph_tracker.py"
  workflow_dispatch:
    inputs:
      proposal_path:
        description: Root-level proposal directory or ZIP
        required: true
        default: /mnt/lexar4tb/multi_uav_lts/outputs/proposal_bank_1920/proposals
        type: string
      truth_dir:
        description: Complete training-label directory
        required: true
        default: /mnt/lexar4tb/multi_uav_lts/extracted/TrainLabels
        type: string
      first_frame_label_dir:
        description: First-frame training labels
        required: true
        default: /mnt/lexar4tb/multi_uav_lts/extracted/TrainLabels_FirstFrameOnly
        type: string
      raw_prediction_path:
        description: Seeded raw baseline predictions used as control
        required: true
        default: /mnt/lexar4tb/multi_uav_lts/outputs/train_baseline/predictions
        type: string
      output_root:
        description: Persistent result root
        required: true
        default: /mnt/lexar4tb/multi_uav_lts/outputs/proposal_graph_experiments
        type: string
      image_width:
        description: Source-frame width for border-aware linking
        required: true
        default: "1920"
        type: string
      image_height:
        description: Source-frame height for border-aware linking
        required: true
        default: "1080"
        type: string
      expected_sequence_count:
        description: Required training-sequence count
        required: true
        default: "102"
        type: string
      require_improvement:
        description: Fail when the guarded tournament selects raw
        required: false
        default: false
        type: boolean
      probe_only:
        description: Check mounted inputs without evaluating
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: multi-uav-lts-proposal-graph-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RAFT_UAV_SKIP_RUNTIME_HOOKS: "1"

jobs:
  focused-tests:
    name: Proposal graph focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out RaFT-UAV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_multi_uav_lts_proposal_graph_tracker.py
          python -m ruff check \
            src/raft_uav/multi_uav_lts/_proposal_graph_core.py \
            src/raft_uav/multi_uav_lts/proposal_graph_tracker.py \
            tests/test_multi_uav_lts_proposal_graph_tracker.py

  experiment:
    name: Guarded proposal graph tournament
    if: github.event_name == 'workflow_dispatch'
    needs: focused-tests
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 720

    env:
      PROPOSAL_PATH: ${{ inputs.proposal_path }}
      TRUTH_DIR: ${{ inputs.truth_dir }}
      FIRST_FRAME_LABEL_DIR: ${{ inputs.first_frame_label_dir }}
      RAW_PREDICTION_PATH: ${{ inputs.raw_prediction_path }}
      OUTPUT_ROOT: ${{ inputs.output_root }}
      IMAGE_WIDTH: ${{ inputs.image_width }}
      IMAGE_HEIGHT: ${{ inputs.image_height }}
      EXPECTED_SEQUENCE_COUNT: ${{ inputs.expected_sequence_count }}
      VENV_PATH: ${{ github.workspace }}/.proposal-graph-${{ github.run_id }}

    steps:
      - name: Check out RaFT-UAV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Prepare run directory
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="${OUTPUT_ROOT}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${RUN_DIR}"
          echo "RUN_DIR=${RUN_DIR}" >> "${GITHUB_ENV}"
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "git_commit=${GITHUB_SHA}"
            uname -a
          } | tee "${RUN_DIR}/runner.txt"
          nvidia-smi -L | tee "${RUN_DIR}/nvidia-smi-L.txt"

      - name: Probe mounted inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def record(raw: str) -> dict[str, object]:
              path = Path(raw).expanduser()
              return {
                  "path": str(path),
                  "is_dir": path.is_dir(),
                  "is_file": path.is_file(),
                  "txt_count": len(list(path.glob("*.txt")))
                  if path.is_dir()
                  else None,
              }

          paths = {
              "proposals": record(os.environ["PROPOSAL_PATH"]),
              "truth": record(os.environ["TRUTH_DIR"]),
              "seeds": record(os.environ["FIRST_FRAME_LABEL_DIR"]),
              "raw": record(os.environ["RAW_PREDICTION_PATH"]),
          }
          expected = int(os.environ["EXPECTED_SEQUENCE_COUNT"])
          image_width = float(os.environ["IMAGE_WIDTH"])
          image_height = float(os.environ["IMAGE_HEIGHT"])
          payload = {
              "schema": "raft-uav-lts-proposal-graph-probe-v1",
              "paths": paths,
              "expected_sequence_count": expected,
              "image_width": image_width,
              "image_height": image_height,
          }
          output = Path(os.environ["RUN_DIR"]) / "probe.json"
          output.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          missing = []
          if not (paths["proposals"]["is_dir"] or paths["proposals"]["is_file"]):
              missing.append("proposal_path")
          if not paths["truth"]["is_dir"]:
              missing.append("truth_dir")
          if not paths["seeds"]["is_dir"]:
              missing.append("first_frame_label_dir")
          if not (paths["raw"]["is_dir"] or paths["raw"]["is_file"]):
              missing.append("raw_prediction_path")
          if paths["truth"]["txt_count"] != expected:
              missing.append(
                  f"truth sequence count {paths['truth']['txt_count']} != {expected}"
              )
          if paths["seeds"]["txt_count"] != expected:
              missing.append(
                  f"seed sequence count {paths['seeds']['txt_count']} != {expected}"
              )
          if image_width <= 0.0 or image_height <= 0.0:
              missing.append("image dimensions must be positive")
          if missing:
              raise SystemExit("invalid inputs: " + ", ".join(missing))
          PY

      - name: Set up Python 3.11
        if: ${{ ! inputs.probe_only }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install isolated environment
        if: ${{ ! inputs.probe_only }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${VENV_PATH}"
          "${VENV_PATH}/bin/python" -m pip install --upgrade pip
          "${VENV_PATH}/bin/python" -m pip install -e ".[dev]"
          "${VENV_PATH}/bin/python" -m pip freeze --all \
            > "${RUN_DIR}/pip-freeze.txt"

      - name: Generate candidate ablations
        if: ${{ ! inputs.probe_only }}
        shell: bash
        run: |
          set -euo pipefail
          run_candidate() {
            local name="$1"
            shift
            local root="${RUN_DIR}/${name}"
            mkdir -p "${root}"
            "${VENV_PATH}/bin/python" \
              -m raft_uav.multi_uav_lts.proposal_graph_tracker \
              "${PROPOSAL_PATH}" \
              --first-frame-label-dir "${FIRST_FRAME_LABEL_DIR}" \
              --output-dir "${root}/predictions" \
              --output-json "${root}/summary.json" \
              --image-width "${IMAGE_WIDTH}" \
              --image-height "${IMAGE_HEIGHT}" \
              "$@" \
              | tee "${root}/console.txt"
          }
          run_candidate graph_default
          run_candidate graph_no_global --no-global-links
          run_candidate graph_no_border --border-gap-discount 1.0
          run_candidate graph_strict_birth \
            --birth-min-hits 5 \
            --birth-min-span 4 \
            --birth-min-mean-confidence 0.01

      - name: Score candidates and raw control
        if: ${{ ! inputs.probe_only }}
        shell: bash
        run: |
          set -euo pipefail
          score() {
            local name="$1"
            local predictions="$2"
            mkdir -p "${RUN_DIR}/${name}"
            "${VENV_PATH}/bin/python" \
              -m raft_uav.multi_uav_lts.metrics \
              "${predictions}" \
              --truth-dir "${TRUTH_DIR}" \
              --output-json "${RUN_DIR}/${name}/metrics.json" \
              --sequence-summary-csv "${RUN_DIR}/${name}/metrics_by_sequence.csv" \
              | tee "${RUN_DIR}/${name}/metrics-console.txt"
          }
          score raw "${RAW_PREDICTION_PATH}"
          for name in graph_default graph_no_global graph_no_border graph_strict_birth
          do
            score "${name}" "${RUN_DIR}/${name}/predictions"
          done

      - name: Run guarded tournament
        if: ${{ ! inputs.probe_only }}
        shell: bash
        env:
          REQUIRE_IMPROVEMENT: ${{ inputs.require_improvement }}
        run: |
          set -euo pipefail
          improvement_args=()
          if [[ "${REQUIRE_IMPROVEMENT}" == "true" ]]; then
            improvement_args+=(--require-improvement)
          fi
          "${VENV_PATH}/bin/python" \
            -m raft_uav.multi_uav_lts.tournament \
            "${RAW_PREDICTION_PATH}" \
            --candidate "graph_default=${RUN_DIR}/graph_default/predictions" \
            --candidate "graph_no_global=${RUN_DIR}/graph_no_global/predictions" \
            --candidate "graph_no_border=${RUN_DIR}/graph_no_border/predictions" \
            --candidate "graph_strict_birth=${RUN_DIR}/graph_strict_birth/predictions" \
            --truth-dir "${TRUTH_DIR}" \
            --output-dir "${RUN_DIR}/tournament" \
            --fold-count 5 \
            --seed 0 \
            --expected-sequence-count "${EXPECTED_SEQUENCE_COUNT}" \
            --bootstrap-samples 5000 \
            --min-mean-hota-gain 0.001 \
            --min-ci-hota-gain 0.0 \
            --max-mean-mota-drop 0.002 \
            --max-mean-idf1-drop 0.002 \
            --max-worst-scenario-hota-drop 0.01 \
            "${improvement_args[@]}" \
            | tee "${RUN_DIR}/tournament-console.txt"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Multi-UAV LTS proposal graph experiment"
            echo
            echo "- Run directory: \`${RUN_DIR}\`"
            echo "- Proposal input: \`${PROPOSAL_PATH}\`"
            echo "- Raw control: \`${RAW_PREDICTION_PATH}\`"
            echo "- Probe only: \`${{ inputs.probe_only }}\`"
            if [[ -f "${RUN_DIR}/tournament/selected_candidate.txt" ]]; then
              echo "- Selected: \`$(cat "${RUN_DIR}/tournament/selected_candidate.txt")\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: multi-uav-lts-proposal-graph-${{ github.run_id }}
          path: ${{ env.RUN_DIR }}/
          if-no-files-found: error
          retention-days: 30
