---
name: Multi-UAV LTS full-stack evidence

"on":
  workflow_dispatch:
    inputs:
      device:
        description: CUDA device
        required: true
        default: "cuda:0"
        type: string
      p2_epochs:
        description: P2 epochs per complementary fold
        required: true
        default: "20"
        type: string
      require_improvement:
        description: Fail when raw remains selected
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: multi-uav-lts-full-stack-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"
  RAFT_UAV_SKIP_RUNTIME_HOOKS: "1"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.11", cache: pip}
      - run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q \
            tests/test_multi_uav_lts_tiny_p2_detector.py \
            tests/test_multi_uav_lts_track_conditioned_proposals.py \
            tests/test_multi_uav_lts_temporal_roi_proposals.py \
            tests/test_multi_uav_lts_imm_trajectory.py \
            tests/test_multi_uav_lts_seeded_multiscan.py \
            tests/test_multi_uav_lts_thermal_edge_model.py \
            tests/test_multi_uav_lts_observable_expert_gate.py \
            tests/test_multi_uav_lts_scenario_folds.py
          python -m py_compile scripts/run_multi_uav_lts_full_stack_evidence.py
          python -m ruff check \
            src/raft_uav/multi_uav_lts/tiny_p2_detector.py \
            src/raft_uav/multi_uav_lts/track_conditioned_proposals.py \
            src/raft_uav/multi_uav_lts/temporal_roi_proposals.py \
            src/raft_uav/multi_uav_lts/imm_trajectory.py \
            src/raft_uav/multi_uav_lts/seeded_multiscan.py \
            src/raft_uav/multi_uav_lts/thermal_edge_model.py \
            src/raft_uav/multi_uav_lts/observable_expert_gate.py \
            scripts/run_multi_uav_lts_full_stack_evidence.py

  evidence:
    needs: focused-tests
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 4320
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.11", cache: pip}
      - name: Establish persistent paths
        run: |
          set -euo pipefail
          ROOT=/mnt/corsair/raft-uav-public-evidence/multi-uav-lts-zenodo-15853476
          RUN_DIR="${ROOT}/full-stack/${GITHUB_HEAD_SHA:-$GITHUB_SHA}"
          VENV="${ROOT}/runtime/venvs/proposal-graph-py311-torch222"
          mkdir -p "$RUN_DIR"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          echo "VENV=$VENV" >> "$GITHUB_ENV"
      - name: Acquire public inputs and runtime
        run: |
          set -euo pipefail
          python scripts/bootstrap_multi_uav_lts_public_evidence.py \
            --work-root "$ROOT" --output-json "$RUN_DIR/inputs.json" \
            --expected-sequence-count 102 --expected-frame-count 77293
          bash scripts/install_multi_uav_lts_public_runtime.sh \
            "$VENV" "$ROOT/assets/runtime" "$RUN_DIR/runtime.json"
          bash scripts/install_multi_uav_lts_runtime_extras.sh "$VENV" "$RUN_DIR/runtime.json"
          "$VENV/bin/python" - "$RUN_DIR/inputs.json" >> "$GITHUB_ENV" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); d=p['dataset']
          print('IMAGES='+d['train_sequence_root'])
          print('TRUTH='+d['truth_dir'])
          print('SEEDS='+d['first_frame_label_dir'])
          PY
      - name: Ensure permissive proposal source
        run: |
          set -euo pipefail
          SOURCE="$ROOT/outputs/full-stack-proposal-source"
          if [[ ! -d "$SOURCE/proposals" ]]; then
            "$VENV/bin/python" -m raft_uav.multi_uav_lts.proposal_baseline \
              --work-root "$ROOT" --sequence-root "$IMAGES" \
              --first-frame-label-dir "$SEEDS" --output-dir "$SOURCE" \
              --no-template --python "$VENV/bin/python" --device 0 --img-size 1920 \
              --proposal-conf-thres 0.001 --proposal-iou-thres 0.95
          fi
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
      - name: Build folds and run full stack
        run: |
          set -euo pipefail
          "$VENV/bin/python" scripts/build_multi_uav_lts_scenario_folds.py \
            "$IMAGES" --output "$RUN_DIR/folds.csv" --fold-count 5
          args=()
          if [[ "${{ inputs.require_improvement }}" == true ]]; then args+=(--require-improvement); fi
          "$VENV/bin/python" scripts/run_multi_uav_lts_full_stack_evidence.py \
            --image-root "$IMAGES" --truth-dir "$TRUTH" --seed-dir "$SEEDS" \
            --raw-dir "$SOURCE/predictions" --base-proposal-dir "$SOURCE/proposals" \
            --fold-assignments "$RUN_DIR/folds.csv" --run-dir "$RUN_DIR" \
            --python "$VENV/bin/python" --device "${{ inputs.device }}" \
            --p2-epochs "${{ inputs.p2_epochs }}" "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: multi-uav-lts-full-stack-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ env.RUN_DIR }}/full-stack-summary.json
            ${{ env.RUN_DIR }}/progress.json
            ${{ env.RUN_DIR }}/experiment-contract.json
            ${{ env.RUN_DIR }}/folds.csv
            ${{ env.RUN_DIR }}/gate-scores.csv
            ${{ env.RUN_DIR }}/gate-evidence.json
            ${{ env.RUN_DIR }}/folds/*/*.json
            ${{ env.RUN_DIR }}/scores/*.json
            ${{ env.RUN_DIR }}/scores/*.csv
            ${{ env.RUN_DIR }}/tournament/*.json
            ${{ env.RUN_DIR }}/tournament/*.csv
            ${{ env.RUN_DIR }}/tournament/selected_candidate.txt
            ${{ env.RUN_DIR }}/logs/*.log
