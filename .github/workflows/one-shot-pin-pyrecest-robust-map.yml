name: One-shot PyRecEst robust MAP dependency pin

on:
  push:
    branches:
      - agent/use-pyrecest-robust-map-smoother

permissions:
  contents: write

jobs:
  pin-dependency:
    if: github.event.head_commit.message == 'Add one-shot PyRecEst robust MAP dependency pin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin PyRecEst integration commit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          old = '    "pyrecest @ git+https://github.com/FlorianPfaff/PyRecEst.git@main",'
          new = '    "pyrecest @ git+https://github.com/FlorianPfaff/PyRecEst.git@de9998b3c2b707df4e4ca87681c2af5a3958ccfd",'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one PyRecEst main dependency")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Regenerate lockfile
        run: |
          python -m pip install --disable-pip-version-check 'poetry==2.3.4'
          poetry lock --no-interaction

      - name: Commit generated dependency files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-pin-pyrecest-robust-map.yml
          git add pyproject.toml poetry.lock
          git diff --cached --check
          git commit -m 'Pin PyRecEst robust MAP integration head'
          git push origin "HEAD:${GITHUB_REF_NAME}"
