name: One-shot PyRecEst robust MAP dependency pin

on:
  push:
    branches:
      - agent/use-pyrecest-robust-map-smoother

permissions:
  contents: write

jobs:
  pin-dependency:
    if: github.event.head_commit.message == 'Add one-shot PyRecEst robust MAP dependency pin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin PyRecEst and normalize the adapter import block
        run: |
          python - <<'PY'
          from pathlib import Path

          project = Path("pyproject.toml")
          text = project.read_text(encoding="utf-8")
          old = '    "pyrecest @ git+https://github.com/FlorianPfaff/PyRecEst.git@main",'
          new = '    "pyrecest @ git+https://github.com/FlorianPfaff/PyRecEst.git@de9998b3c2b707df4e4ca87681c2af5a3958ccfd",'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one PyRecEst main dependency")
          project.write_text(text.replace(old, new), encoding="utf-8")

          adapter = Path("src/raft_uav/baselines/robust_map.py")
          text = adapter.read_text(encoding="utf-8")
          old = '''from pyrecest.smoothers import (
              LinearGaussianMeasurementFactor as _PyRecEstMeasurementFactor,
          )
          from pyrecest.smoothers import (
              RobustLinearGaussianMapConfig as _PyRecEstRobustMapConfig,
          )
          from pyrecest.smoothers import (
              fixed_lag_robust_linear_gaussian_map_smooth as _pyrecest_fixed_lag_robust_map,
          )
          from pyrecest.smoothers import (
              robust_linear_gaussian_map_smooth as _pyrecest_robust_map,
          )
          from pyrecest.smoothers.robust_linear_gaussian_map import (
              ROBUST_LINEAR_GAUSSIAN_MAP_LOSSES,
          )
          '''
          new = '''from pyrecest.smoothers import (
              LinearGaussianMeasurementFactor as _PyRecEstMeasurementFactor,
              ROBUST_LINEAR_GAUSSIAN_MAP_LOSSES,
              RobustLinearGaussianMapConfig as _PyRecEstRobustMapConfig,
              fixed_lag_robust_linear_gaussian_map_smooth as _pyrecest_fixed_lag_robust_map,
              robust_linear_gaussian_map_smooth as _pyrecest_robust_map,
          )
          '''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one robust MAP import block")
          adapter.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Regenerate lockfile
        run: |
          python -m pip install --disable-pip-version-check 'poetry==2.3.4'
          poetry lock --no-interaction

      - name: Commit generated dependency files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-pin-pyrecest-robust-map.yml
          git rm .github/one-shot-pin-pyrecest-robust-map.trigger
          git add pyproject.toml poetry.lock src/raft_uav/baselines/robust_map.py
          git diff --cached --check
          git commit -m 'Pin PyRecEst robust MAP integration head'
          git push origin "HEAD:${GITHUB_REF_NAME}"
