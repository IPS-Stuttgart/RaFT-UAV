name: Validate exact Track 5 template-row fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/fix-exact-track5-template-rows' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-exact-track5-template-rows
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply focused patch and regression tests
        run: python tools/_agent_apply_exact_template_row_fix.py

      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused regression tests
        run: pytest -q tests/test_mmuad_track5_exact_template_rows.py

      - name: Run focused Ruff checks
        run: >-
          ruff check
          src/raft_uav/mmuad/track5_estimate_ensemble/__init__.py
          src/raft_uav/mmuad/track5_uncertainty_ensemble/__init__.py
          src/raft_uav/mmuad/track5_estimate_consensus_ensemble/__init__.py
          src/raft_uav/mmuad/track5_estimate_ensemble_spread_guard/__init__.py
          tests/test_mmuad_track5_exact_template_rows.py

      - name: Compile changed Python files
        run: >-
          python -m py_compile
          src/raft_uav/mmuad/track5_estimate_ensemble/__init__.py
          src/raft_uav/mmuad/track5_uncertainty_ensemble/__init__.py
          src/raft_uav/mmuad/track5_estimate_consensus_ensemble/__init__.py
          src/raft_uav/mmuad/track5_estimate_ensemble_spread_guard/__init__.py
          tests/test_mmuad_track5_exact_template_rows.py

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep Track 5 template rows exact after resampling'
          git push origin HEAD:agent/fix-exact-track5-template-rows
