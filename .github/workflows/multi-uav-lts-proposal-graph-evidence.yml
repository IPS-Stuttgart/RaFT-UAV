---
name: Multi-UAV LTS proposal graph evidence

"on":
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/multi-uav-lts-proposal-graph-evidence.yml"
      - "scripts/bootstrap_multi_uav_lts_public_evidence.py"
      - "scripts/install_multi_uav_lts_public_runtime.sh"
      - "scripts/run_multi_uav_lts_public_evidence.py"
      - "scripts/run_multi_uav_lts_official_baseline.py"
      - "src/raft_uav/multi_uav_lts/**"
      - "tests/test_multi_uav_lts_proposal_graph_tracker.py"
  workflow_dispatch:
    inputs:
      device:
        description: CUDA device used for proposal generation
        required: true
        default: "0"
        type: string
      expected_sequence_count:
        description: Required number of official training sequences
        required: true
        default: "102"
        type: string
      expected_frame_count:
        description: Required number of official training frames
        required: true
        default: "77293"
        type: string
      require_improvement:
        description: Fail unless a graph candidate passes the guarded tournament
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: multi-uav-lts-proposal-graph-evidence-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RAFT_UAV_SKIP_RUNTIME_HOOKS: "1"

jobs:
  focused-tests:
    name: Proposal graph focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out RaFT-UAV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_multi_uav_lts_proposal_graph_tracker.py
          python -m py_compile \
            scripts/bootstrap_multi_uav_lts_public_evidence.py \
            scripts/run_multi_uav_lts_public_evidence.py
          bash -n scripts/install_multi_uav_lts_public_runtime.sh
          python scripts/bootstrap_multi_uav_lts_public_evidence.py --help >/dev/null
          python scripts/run_multi_uav_lts_public_evidence.py --help >/dev/null
          python -m ruff check \
            scripts/bootstrap_multi_uav_lts_public_evidence.py \
            scripts/run_multi_uav_lts_public_evidence.py \
            src/raft_uav/multi_uav_lts/_proposal_graph_core.py \
            src/raft_uav/multi_uav_lts/proposal_graph_tracker.py \
            tests/test_multi_uav_lts_proposal_graph_tracker.py

  train-evidence:
    name: Guarded 102-sequence proposal graph tournament
    needs: focused-tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 720

    env:
      GPU_DEVICE: ${{ inputs.device || '0' }}
      EXPECTED_SEQUENCE_COUNT: ${{ inputs.expected_sequence_count || '102' }}
      EXPECTED_FRAME_COUNT: ${{ inputs.expected_frame_count || '77293' }}
      REQUIRE_IMPROVEMENT: >-
        ${{ github.event_name == 'pull_request' || inputs.require_improvement }}

    steps:
      - name: Check out RaFT-UAV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Select writable persistent cache and inventory runner
        shell: bash
        run: |
          set -euo pipefail
          minimum_free_bytes=$((16 * 1024 * 1024 * 1024))
          best_root=""
          best_free=0
          candidates=(
            "/mnt/corsair/raft-uav-public-evidence"
            "${HOME}/.cache/raft-uav-public-evidence"
            "${RUNNER_TEMP}/raft-uav-public-evidence"
          )
          inventory="${RUNNER_TEMP}/raft-uav-cache-candidates.txt"
          : > "${inventory}"
          for candidate in "${candidates[@]}"; do
            free_bytes=0
            if mkdir -p "${candidate}" 2>/dev/null; then
              probe="${candidate}/.write-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              if printf 'ok\n' > "${probe}" 2>/dev/null; then
                rm -f "${probe}"
                free_bytes="$(
                  df -PB1 "${candidate}" | awk 'NR == 2 {print $4}'
                )"
              fi
            fi
            printf '%s\t%s\n' "${candidate}" "${free_bytes}" >> "${inventory}"
            if (( free_bytes > best_free )); then
              best_root="${candidate}"
              best_free="${free_bytes}"
            fi
          done
          if [[ -z "${best_root}" ]]; then
            echo "No writable evidence cache is available." >&2
            cat "${inventory}" >&2
            exit 1
          fi
          if (( best_free < minimum_free_bytes )); then
            echo "Largest writable cache has ${best_free} free bytes." >&2
            cat "${inventory}" >&2
            exit 1
          fi

          cache_root="${best_root}"
          work_root="${cache_root}/multi-uav-lts-zenodo-15853476"
          run_dir="${work_root}/evidence-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          venv_path="${work_root}/venvs/proposal-graph-py311-torch222"
          asset_dir="${work_root}/assets/runtime"
          inputs_json="${run_dir}/public-inputs.json"
          mkdir -p "${run_dir}" "${asset_dir}" "$(dirname "${venv_path}")"

          {
            printf 'CACHE_ROOT=%s\n' "${cache_root}"
            printf 'WORK_ROOT=%s\n' "${work_root}"
            printf 'RUN_DIR=%s\n' "${run_dir}"
            printf 'VENV_PATH=%s\n' "${venv_path}"
            printf 'ASSET_DIR=%s\n' "${asset_dir}"
            printf 'INPUTS_JSON=%s\n' "${inputs_json}"
          } >> "${GITHUB_ENV}"

          python - \
            "${inventory}" \
            "${run_dir}/cache-selection.json" \
            "${cache_root}" \
            "${best_free}" \
            "${minimum_free_bytes}" <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          inventory_path, output_path, selected, free_bytes, minimum = sys.argv[1:]
          candidates = []
          for line in Path(inventory_path).read_text(encoding="utf-8").splitlines():
              path, free = line.split("\t", 1)
              candidates.append(
                  {
                      "path": path,
                      "writable": int(free) > 0,
                      "free_bytes": int(free),
                  }
              )
          payload = {
              "schema": "raft-uav-evidence-cache-selection-v1",
              "selected_cache_root": selected,
              "selected_free_bytes": int(free_bytes),
              "minimum_free_bytes": int(minimum),
              "candidates": candidates,
          }
          Path(output_path).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "git_commit=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "home=${HOME}"
            echo "workspace=${GITHUB_WORKSPACE}"
            echo "runner_temp=${RUNNER_TEMP}"
            uname -a
          } | tee "${run_dir}/runner.txt"
          nvidia-smi -L | tee "${run_dir}/nvidia-smi-L.txt"
          df -hT | tee "${run_dir}/disk-usage.txt"
          findmnt -rn -o TARGET,SOURCE,FSTYPE,OPTIONS \
            > "${run_dir}/mounts.txt" || true

      - name: Acquire and verify official public inputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/bootstrap_multi_uav_lts_public_evidence.py \
            --work-root "${WORK_ROOT}" \
            --output-json "${INPUTS_JSON}" \
            --expected-sequence-count "${EXPECTED_SEQUENCE_COUNT}" \
            --expected-frame-count "${EXPECTED_FRAME_COUNT}" \
            | tee "${RUN_DIR}/public-inputs-console.txt"

      - name: Install and verify pinned GPU runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_multi_uav_lts_public_runtime.sh \
            "${VENV_PATH}" \
            "${ASSET_DIR}" \
            "${RUN_DIR}/runtime-provenance.json" \
            | tee "${RUN_DIR}/runtime-install-console.txt"

      - name: Regenerate and score complete evidence
        shell: bash
        run: |
          set -euo pipefail
          improvement_args=()
          if [[ "${REQUIRE_IMPROVEMENT}" == "true" ]]; then
            improvement_args+=(--require-improvement)
          fi
          "${VENV_PATH}/bin/python" \
            scripts/run_multi_uav_lts_public_evidence.py \
            --inputs-json "${INPUTS_JSON}" \
            --run-dir "${RUN_DIR}" \
            --device "${GPU_DEVICE}" \
            --expected-sequence-count "${EXPECTED_SEQUENCE_COUNT}" \
            --expected-frame-count "${EXPECTED_FRAME_COUNT}" \
            "${improvement_args[@]}" \
            | tee "${RUN_DIR}/evidence-console.txt"

      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          run_dir_text = os.environ.get("RUN_DIR")
          print("### Multi-UAV LTS proposal graph evidence")
          print()
          print(f"- Commit: `{os.environ.get('GITHUB_SHA', 'unknown')}`")
          print(f"- Runner: `{os.environ.get('RUNNER_NAME', 'unknown')}`")
          print(f"- Required sequences: `{os.environ.get('EXPECTED_SEQUENCE_COUNT')}`")
          print(f"- Required frames: `{os.environ.get('EXPECTED_FRAME_COUNT')}`")
          if not run_dir_text:
              print("- Result: run directory was not established")
              raise SystemExit(0)

          run_dir = Path(run_dir_text)
          success_path = run_dir / "evidence-summary.json"
          failure_path = run_dir / "evidence-failure.json"
          payload = None
          if success_path.is_file():
              payload = json.loads(success_path.read_text(encoding="utf-8"))
              print("- Result: **success**")
          elif failure_path.is_file():
              payload = json.loads(failure_path.read_text(encoding="utf-8"))
              print("- Result: **failure**")
              print(f"- Failed stage: `{payload.get('stage', 'unknown')}`")
              print(
                  "- Failure: "
                  f"`{payload.get('exception_type', 'Error')}: "
                  f"{payload.get('exception_message', 'unknown')}`"
              )
          else:
              progress_path = run_dir / "progress.json"
              if progress_path.is_file():
                  progress = json.loads(progress_path.read_text(encoding="utf-8"))
                  print(f"- Last stage: `{progress.get('stage', 'unknown')}`")
              else:
                  print("- Result: no machine-readable evidence record was produced")
              raise SystemExit(0)

          tournament = payload.get("tournament") if payload else None
          if not isinstance(tournament, dict):
              raise SystemExit(0)
          print(
              f"- Selected candidate: "
              f"`{tournament.get('selected_candidate', 'unknown')}`"
          )
          print(f"- Selection status: `{tournament.get('selection_status', 'unknown')}`")
          rows = tournament.get("rows")
          if not isinstance(rows, list):
              raise SystemExit(0)
          print()
          print(
              "| Candidate | Eligible | Mean CV HOTA | Gain vs raw | "
              "CI low | MOTA delta | IDF1 delta |"
          )
          print("|---|---:|---:|---:|---:|---:|---:|")
          for row in rows:
              print(
                  f"| {row.get('name')} | {row.get('eligible')} | "
                  f"{float(row.get('mean_cv_codabench_hota', 0.0)):.6f} | "
                  f"{float(row.get('mean_cv_hota_gain_vs_raw', 0.0)):+.6f} | "
                  f"{float(row.get('paired_hota_gain_ci_low', 0.0)):+.6f} | "
                  f"{float(row.get('mean_cv_mota_delta_vs_raw', 0.0)):+.6f} | "
                  f"{float(row.get('mean_cv_idf1_delta_vs_raw', 0.0)):+.6f} |"
              )
          PY

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: multi-uav-lts-proposal-graph-${{ github.run_id }}
          path: |
            ${{ env.RUN_DIR }}/runner.txt
            ${{ env.RUN_DIR }}/nvidia-smi-L.txt
            ${{ env.RUN_DIR }}/disk-usage.txt
            ${{ env.RUN_DIR }}/mounts.txt
            ${{ env.RUN_DIR }}/cache-selection.json
            ${{ env.RUN_DIR }}/public-inputs.json
            ${{ env.RUN_DIR }}/public-inputs-console.txt
            ${{ env.RUN_DIR }}/runtime-provenance.json
            ${{ env.RUN_DIR }}/runtime-install-console.txt
            ${{ env.RUN_DIR }}/pip-freeze.txt
            ${{ env.RUN_DIR }}/probe.json
            ${{ env.RUN_DIR }}/progress.json
            ${{ env.RUN_DIR }}/proposal-source-manifest.json
            ${{ env.RUN_DIR }}/proposal-baseline-console.txt
            ${{ env.RUN_DIR }}/evidence-console.txt
            ${{ env.RUN_DIR }}/evidence-summary.json
            ${{ env.RUN_DIR }}/evidence-failure.json
            ${{ env.RUN_DIR }}/raw/*.json
            ${{ env.RUN_DIR }}/raw/*.csv
            ${{ env.RUN_DIR }}/raw/*console.txt
            ${{ env.RUN_DIR }}/graph_*/*.json
            ${{ env.RUN_DIR }}/graph_*/*.csv
            ${{ env.RUN_DIR }}/graph_*/*console.txt
            ${{ env.RUN_DIR }}/tournament/*.json
            ${{ env.RUN_DIR }}/tournament/*.csv
            ${{ env.RUN_DIR }}/tournament/*.txt
            ${{ env.RUN_DIR }}/tournament-console.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
