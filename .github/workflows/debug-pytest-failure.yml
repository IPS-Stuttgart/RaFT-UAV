---
name: Debug pytest failure

"on":
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  capture:
    if: github.head_ref == 'fix/mot-physical-flight-scope' || github.ref_name == 'fix/mot-physical-flight-scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Capture complete pytest output
        run: |
          set +e
          pytest -q --tb=short > pytest-output.txt 2>&1
          status=$?
          printf '%s\n' "$status" > pytest-exit-code.txt
          exit 0
      - name: Upload pytest diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: pytest-failure-output
          path: |
            pytest-output.txt
            pytest-exit-code.txt
          retention-days: 1
