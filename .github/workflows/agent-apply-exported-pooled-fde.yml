name: Apply exported pooled FDE fix

on:
  push:
    branches:
      - agent/fix-exported-pooled-fde

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused source and regression changes
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("src/raft_uav/mmuad/_submission_impl.py")
          source = source_path.read_text(encoding="utf-8")

          replacements = {
              '"fde_3d_m": _final_error(frame, "error_3d_m"),':
                  '"fde_3d_m": _mean_final_error(frame, "error_3d_m"),',
              '"fde_2d_m": _final_error(frame, "error_2d_m"),':
                  '"fde_2d_m": _mean_final_error(frame, "error_2d_m"),',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise RuntimeError(f"expected exactly one source occurrence of {old!r}")
              source = source.replace(old, new, 1)

          marker = "\n\ndef _final_error(frame: pd.DataFrame, column: str) -> float:\n"
          if source.count(marker) != 1:
              raise RuntimeError("could not locate the unique _final_error insertion point")
          helper = '''def _mean_final_error(frame: pd.DataFrame, column: str) -> float:
              """Average endpoint errors across each sequence/track trajectory."""

              key_columns = [
                  key for key in ("sequence_id", "track_id") if key in frame.columns
              ]
              if not key_columns:
                  return _final_error(frame, column)

              final_errors: list[float] = []
              for _, trajectory in frame.groupby(key_columns, sort=False, dropna=False):
                  final_error = _final_error(trajectory, column)
                  if np.isfinite(final_error):
                      final_errors.append(final_error)
              return float(np.mean(final_errors)) if final_errors else float("nan")'''
          source = source.replace(marker, "\n\n" + helper + marker, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_mmuad_submission_pooled_fde.py")
          if test_path.exists():
              raise RuntimeError(f"unexpected pre-existing regression file: {test_path}")
          test_path.write_text(
              '''from __future__ import annotations

          import pandas as pd

          from raft_uav.mmuad.submission import compute_trajectory_metrics


          def test_exported_pooled_fde_averages_each_sequence_endpoint() -> None:
              estimates = pd.DataFrame(
                  {
                      "sequence_id": ["short", "short", "long", "long"],
                      "time_s": [0.0, 1.0, 0.0, 2.0],
                      "error_3d_m": [1.0, 100.0, 2.0, 20.0],
                      "error_2d_m": [1.0, 60.0, 2.0, 12.0],
                  }
              )

              metrics = compute_trajectory_metrics(estimates)

              assert metrics["pooled"]["fde_3d_m"] == 60.0
              assert metrics["pooled"]["fde_2d_m"] == 36.0
              assert metrics["sequences"]["short"]["fde_3d_m"] == 100.0
              assert metrics["sequences"]["long"]["fde_3d_m"] == 20.0


          def test_exported_sequence_fde_averages_each_track_endpoint() -> None:
              estimates = pd.DataFrame(
                  {
                      "sequence_id": ["seq1", "seq1", "seq1", "seq1"],
                      "track_id": ["a", "a", "b", "b"],
                      "time_s": [0.0, 2.0, 0.0, 1.0],
                      "error_3d_m": [1.0, 20.0, 2.0, 100.0],
                      "error_2d_m": [1.0, 12.0, 2.0, 60.0],
                  }
              )

              metrics = compute_trajectory_metrics(estimates)

              assert metrics["pooled"]["fde_3d_m"] == 60.0
              assert metrics["pooled"]["fde_2d_m"] == 36.0
              assert metrics["sequences"]["seq1"]["fde_3d_m"] == 60.0
              assert metrics["sequences"]["seq1"]["fde_2d_m"] == 36.0
          '''.replace("\n          ", "\n").lstrip(),
              encoding="utf-8",
          )

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run focused regressions
        run: |
          python -m pytest \
            tests/test_mmuad_submission_pooled_fde.py \
            tests/test_mmuad_evaluate_pooled_fde.py \
            -q

      - name: Lint focused changes
        run: |
          python -m ruff check \
            src/raft_uav/mmuad/_submission_impl.py \
            tests/test_mmuad_submission_pooled_fde.py

      - name: Commit tested fix
        run: |
          rm .github/workflows/agent-apply-exported-pooled-fde.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix exported pooled FDE aggregation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
